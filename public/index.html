<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL Live Stats Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <h1>NFL Live Stats Explorer</h1>
        <div class="controls">
            <label for="year-select">Season</label>
            <select id="year-select"></select>
            <label for="week-select">Week</label>
            <select id="week-select"></select>
            <button id="refresh-btn">Refresh</button>
        </div>
    </header>

    <main>
        <section id="scoreboard" class="scoreboard">
            <p class="message">Loading games...</p>
        </section>

        <section id="game-detail" class="game-detail hidden">
            <button id="close-detail">Back to scoreboard</button>
            <h2 id="detail-title"></h2>
            <p id="detail-status"></p>
            <div id="detail-plays"></div>
        </section>
    </main>

    <script src="espn.js"></script>
    <script src="app.js"></script>
</body>
</html>
